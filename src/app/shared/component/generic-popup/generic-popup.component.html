<div class="row filter-wrapper">
    <div class="col-md-12 pad_0_over filter-content">
        <div class="bg_clr_pop">
            <div class="d-flex justify-content-between pad_pop">
                <h1 class="mb-0 font_18">{{ componentDetails }}</h1>
                <img
                    (click)="onCancel()"
                    src="../../../../assets/images/cross_icon.svg"
                    alt=""
                    style="cursor: pointer"
                    class="width_18"
                />
            </div>
        </div>
        <div>
            <div>
                <ng-container *ngTemplateOutlet="filterTemplet"> </ng-container>
            </div>
            <div class="mb-0" style="float: right">
                <div
                    class="d-flex pad_pop"
                    *ngIf="componentDetails !== 'Suggested stops'"
                >
                    <button
                        mat-button
                        class="Common_btn mr-1"
                        (click)="onSave()"
                        *ngIf="infoProvide !== 'showInfoOnly'"
                    >
                        Save
                    </button>
                    <button
                        mat-button
                        (click)="onCancel()"
                        class="Common_btn ml5"
                    >
                        Cancel
                    </button>
                </div>

                <div
                    class="d-flex pad_pop"
                    *ngIf="componentDetails === 'Suggested stops'"
                >
                    <button
                        mat-button
                        class="Common_btn mr-1"
                        (click)="onSave('OptimizeRoute')"
                    >
                        Optimize Route
                    </button>

                    <button
                        mat-button
                        (click)="onCancel()"
                        class="Common_btn ml5"
                    >
                        Cancel
                    </button>

                    <button
                        mat-button
                        style="margin-left: auto !important"
                        (click)="onAddNew()"
                        class="Common_btn ml5"
                    >
                        Add New Stop
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
