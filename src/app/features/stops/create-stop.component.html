
    <div class="row">
        <div class="col-md-12 pad_0_over">
            <div class="bg_clr_pop">
                <div class="d-flex justify-content-between pad_pop">
            <h1 mat-dialog-title class="mb-0 font_18">{{ Header }}</h1>
            <img
            src="../../../../assets/images/cross_icon.svg"
            alt=""
           
            class="width_18"
        />
                </div>
            </div>
            <div mat-dialog-content>
                <form [formGroup]="stopForm">
                    <div class="row create-driver-section pad_pop">
                        <div class="col-md-4">
                            <mat-label class="lable"
                                >Name
                                <span class="text-danger">*</span>
                            </mat-label>
                            <mat-form-field appearance="outline">
                                <input class="txt_bx" 
                                    matInput
                                    placeholder="Name"
                                    formControlName="name"
                                    type="text"
                                />
                                <mat-error
                                    *ngIf="
                                        stopForm
                                            .get('name')
                                            ?.hasError('required')
                                    "
                                >
                                    Name is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">Contact No<span class="text-danger">*</span></mat-label
                            >
                            <mat-form-field appearance="outline">
                                <input class="txt_bx"
                                    type="text"
                                    matInput
                                    placeholder="Contact No"
                                    formControlName="contactno"
                                />
                                <mat-error
                                    *ngIf="
                                        stopForm
                                            .get('contactno')
                                            ?.hasError('required')
                                    "
                                >
                                    Contact No is required
                                </mat-error>
                            </mat-form-field>
                        </div>

                        <div class="col-md-4">
                            <mat-label class="lable pop_font"
                                >Time
                                <span class="text-danger">*</span></mat-label
                            >
                            <mat-form-field appearance="outline">
                                <input class="txt_bx" 
                                    matInput
                                    placeholder="Time"
                                    formControlName="time"
                                    type="time"
                                />
                                <mat-error
                                    *ngIf="
                                        stopForm
                                            .get('time')
                                            ?.hasError('required')
                                    "
                                >
                                    Time is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font"
                                >Address
                                <span class="text-danger">*</span>
                            </mat-label>
                            <mat-form-field appearance="outline">
                                <input class="txt_bx" 
                                    matInput
                                    placeholder="Address"
                                    formControlName="address"
                                    type="text"
                                />
                                <mat-error
                                    *ngIf="
                                        stopForm
                                            .get('address')
                                            ?.hasError('required')
                                    "
                                >
                                    Address is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">City</mat-label>
                            <mat-form-field appearance="outline">
                                <mat-select formControlName="city">
                                    <mat-option value="Ahmedabad"
                                        >Ahmedabad</mat-option
                                    >
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">Zipcode</mat-label>
                            <mat-form-field appearance="outline">
                                <input class="txt_bx" 
                                    type="text"
                                    matInput
                                    placeholder="Zipcode"
                                    formControlName="zipcode"
                                />
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">State</mat-label>
                            <mat-form-field appearance="outline">
                                <mat-select formControlName="state">
                                    <mat-option value="Gujarat"
                                        >Gujarat</mat-option
                                    >
                                    <mat-option value="Maharashtra"
                                        >Maharashtra</mat-option
                                    >
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">Type</mat-label>
                            <mat-form-field appearance="outline">
                                <mat-select formControlName="type">
                                    <mat-option value="Required"
                                        >Required</mat-option
                                    >
                                    <mat-option value="Optional"
                                        >Optional</mat-option
                                    >
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-md-4">
                            <mat-label class="lable pop_font">Remark</mat-label>
                            <mat-form-field appearance="outline">
                                <input class="txt_bx"
                                    type="text"
                                    matInput
                                    placeholder="Add Text Here"
                                    formControlName="remark"
                                />
                            </mat-form-field>
                        </div>
                    </div>
                    <div mat-dialog-actions class="mb-0">
                        <div class="d-flex pad_pop">
                        <button mat-button class="Common_btn" (click)="save()">
                            Save
                        </button>
                        <button
                            mat-button
                            mat-dialog-close
                            (click)="onNoClick()"
                            class="Common_btn"
                        >
                            Cancel
                        </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
