<div class="login row">
    <div class="left_login col-lg-7 col-md-6 col-sm-12">
        <div>
            <span
                ><img
                    class="pb-5"
                    style="width: 100px"
                    src="/assets/images/logo.svg"
            /></span>
            <p class="welcome_txt">WELCOME TO</p>
            <p class="Route_txt">Route Optimization</p>
            <img src="/assets/images/Line 1.svg" />
            <p class="login_cust">Login to Access Dashboard</p>
        </div>
    </div>
    <div class="right_login col-lg-5 col-md-6 col-sm-12">
        <div class="form">
            <form class="my-form" [formGroup]="loginForm">
                <div class="row">
                    <!-- <h2 class="login_header paddingleftright0">
                        Route Optimization
                    </h2> -->
                    <p class="login_right_head">
                        Welcome Back. Please login to your account.
                    </p>
                    <!-- <div class="row" *ngIf="errorMsg">
                        <span class="text-danger" style="font-size: 13px">
                            {{ errorMsg }}
                        </span>
                    </div> -->

                    <p class="error-msg" *ngIf="errorMsg">
                        {{ errorMsg
                        }}<b
                            ><img
                                class="cancelicon"
                                src="assets/images/error-close.svg"
                                (click)="hideMsg()"
                        /></b>
                    </p>

                    <p class="success-msg" *ngIf="successMessage">
                        {{ successMessage
                        }}<b
                            ><img
                                class="cancelicon"
                                src="assets/images/success-close.svg"
                                (click)="hideMsg()"
                        /></b>
                    </p>
                </div>

                <div class="row">
                    <mat-label
                        class="col-lg-9 col-md-11 col-sm-12 paddingleftright0 loginlbl margin-top-30"
                    >
                        User Name
                    </mat-label>
                    <mat-form-field
                        class="col-lg-11 col-md-11 col-sm-12 logintxtbx"
                    >
                        <input
                            matInput
                            formControlName="userName"
                            maxlength="100"
                            name="userName"
                            required
                        />
                        <mat-error
                            *ngIf="
                                (loginForm.controls['userName'].touched ||
                                    submitted) &&
                                loginForm.controls['userName'].hasError(
                                    'required'
                                )
                            "
                        >
                            Please enter user name</mat-error
                        >
                        <!-- <mat-error
                            *ngIf="loginForm.get('email')?.hasError('pattern')"
                            >Please enter valid email</mat-error
                        > -->
                    </mat-form-field>
                </div>
                <div class="row">
                    <mat-label
                        class="col-lg-9 col-md-11 col-sm-12 paddingleftright0 loginlbl margin-top-30"
                    >
                        Password
                    </mat-label>
                    <mat-form-field
                        class="col-lg-11 col-md-11 col-sm-12 logintxtbx"
                    >
                        <input
                            matInput
                            (keyup.enter)="login()"
                            formControlName="password"
                            [type]="hidePassword ? 'password' : 'text'"
                        />
                        <mat-error
                            *ngIf="
                                (loginForm.controls['password'].touched ||
                                    submitted) &&
                                loginForm.controls['password'].hasError(
                                    'required'
                                )
                            "
                        >
                            Please enter password</mat-error
                        >
                        <button
                            mat-icon-button
                            matSuffix
                            (click)="togglePasswordVisibility()"
                        >
                            <mat-icon class="font21">{{
                                hidePassword ? 'visibility_off' : 'visibility'
                            }}</mat-icon>
                        </button>
                    </mat-form-field>
                </div>

                <div class="row">
                    <div
                        class="col-lg-11 col-md-11 col-sm-12 paddingleftright0 mt-10"
                    >
                        <mat-checkbox
                            color="primary"
                            class="pull-left chk_label link"
                            formControlName="rememberMeCheck"
                            >Remember me</mat-checkbox
                        >
                        <a routerLink="forgot-password">
                            <mat-label class="pull-right link forgot_hover"
                                >Forgot Password ?</mat-label
                            >
                        </a>
                    </div>
                </div>

                <div class="row margin-top-30">
                    <div
                        class="col-lg-11 col-md-11 col-sm-12 paddingleftright0 row-btn"
                    >
                        <button
                            mat-button
                            class="pull-left Common_btn login_btn col-lg-5 mr10"
                            (click)="login()"
                        >
                            Login
                        </button>
                        <button
                            mat-button
                            class="pull-right Common_btn Create_btn col-lg-5"
                            routerLink="create-account"
                        >
                            Create Account
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
