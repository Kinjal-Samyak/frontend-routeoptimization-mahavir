<div class="section-view">
    <div class="col-md-12 pad_lr_0 mb5">
        <div class="example-container mat-elevation-z8 border_cust">
            <form [formGroup]="liveTrackForm" class="login-form">
                <div class="row create-driver-section live-tracking">
                    <!-- Sheet Name Dropdown -->
                    <div class="col-md-3">
                        <mat-label class="lable pop_font">Sheet Name</mat-label>
                        <mat-form-field appearance="outline" class="matform">
                            <mat-select
                                class="select-val"
                                placeholder="Select"
                                formControlName="sheet"
                                (selectionChange)="onChangeSheet($event.value)"
                            >
                                <!-- "All" Option -->
                                <mat-option [value]="'All'">All</mat-option>
                                <mat-option
                                    *ngFor="let sheet of sheetList"
                                    [value]="sheet"
                                >
                                    {{ sheet }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <!-- Buses Dropdown -->
                    <div class="col-md-3">
                        <mat-label class="lable pop_font">Buses</mat-label>
                        <mat-form-field appearance="outline" class="matform">
                            <mat-select
                                class="select-val"
                                placeholder="Select"
                                formControlName="bus"
                                (selectionChange)="onChangeBus($event.value)"
                            >
                                <!-- "All" Option -->
                                <mat-option [value]="'All'">All</mat-option>
                                <mat-option
                                    *ngFor="let bus of busesList"
                                    [value]="bus"
                                >
                                    {{ bus?.bus_number }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <!-- Search Button -->
                    <div class="col-md-2 mt20 Searchview">
                        <button
                            mat-button
                            class="Common_btn Searchbtn"
                            style="margin-top: 8px"
                            (click)="search()"
                        >
                            Search
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <mat-accordion class="mt-collapse">
            <ng-container>
                <mat-expansion-panel hideToggle>
                    <mat-expansion-panel-header>
                        <mat-panel-title class="toggle-icon">
                            <img
                                src="../../../assets/images/_x33_.png"
                                alt=""
                            />
                        </mat-panel-title>
                        <div
                            class="mat-panel mat-label-head"
                            (click)="$event.stopPropagation()"
                        >
                            <mat-panel-description>
                                <div class="header-details head1">
                                    <!-- <span class="mat-span-title"
                                        >Scheduled :
                                        {{ busesList?.length }}</span
                                    > -->
                                    <span class="mat-span-title"
                                        >Working Mins : {{ totalTime }}</span
                                    >
                                    <span class="line"></span>
                                    <span class="mat-span-title"
                                        >Service Time :
                                        {{ totalServiceTime }}</span
                                    >
                                    <span class="line"></span>
                                    <span class="mat-span-title"
                                        >Total Distance: {{ totalKm }} km
                                    </span>
                                </div>
                                <div class="col-md-2 Sear chview">
                                    <button
                                        class="mr-20 pr-10"
                                        mat-raised-button
                                        (click)="downloadFile()"
                                    >
                                        <mat-icon
                                            matTooltip="download"
                                            style="cursor: pointer"
                                            class="download-icon"
                                            >file_download</mat-icon
                                        >
                                        <span class="padding-left-5">
                                            Download</span
                                        >
                                    </button>
                                </div>
                            </mat-panel-description>
                        </div>
                    </mat-expansion-panel-header>
                </mat-expansion-panel>
            </ng-container>
        </mat-accordion>
        <div class="google-maps mt5" style="margin-top: 20px">
            <google-map
                #myGoogleMap
                height="400px"
                width="100%"
                [zoom]="zoom"
                [center]="center"
                [options]="options"
            >
                <!-- Multiple Polylines -->
                <map-polyline
                    *ngFor="let route of routePolylines"
                    [path]="route.path"
                    [options]="route.options"
                ></map-polyline>

                <!-- Multiple Markers -->
                <map-marker
                    *ngFor="let stop of routeMarkers"
                    [position]="stop.position"
                    [label]="stop.label"
                    [title]="stop.title"
                    [icon]="stop.icon"
                >
                </map-marker>
            </google-map>

        </div>
    </div>
</div>
